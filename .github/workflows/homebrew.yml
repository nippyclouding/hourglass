name: Update Homebrew Cask after publication

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: homebrew-cask
  cancel-in-progress: false

jobs:
  update:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download the published archive and derive its checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir -p dist
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "Hourglass_${version}_universal.zip" --dir dist
          node scripts/generate-cask.mjs --repo "$GITHUB_REPOSITORY" --version "$version" --archive "dist/Hourglass_${version}_universal.zip"
      - name: Commit the Cask to the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/hourglass.rb
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Hourglass Homebrew Cask"
          git push origin "HEAD:$DEFAULT_BRANCH"
